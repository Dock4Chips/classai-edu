services:
  mysql:
    image: mysql:8.0.34
    container_name: classai_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: classai_edu
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:7.2
    container_name: classai_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "123456"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: classai_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ../..
      dockerfile: backend_api/Dockerfile
    container_name: classai_backend
    restart: unless-stopped
    env_file:
      - ../../backend_api/.env.docker
    depends_on:
      - mysql
      - redis
      - minio
    ports:
      - "7869:7869"
    volumes:
      - ../../logs:/app/logs
      - ../../model:/app/model
      - ../../yolo_edu:/app/yolo_edu

  frontend_web:
    build:
      context: ../..
      dockerfile: frontend_web/Dockerfile
      args:
        NEXT_PUBLIC_BASE_URL: http://${PUBLIC_HOST:-127.0.0.1}:6080
    container_name: classai_frontend_web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

  frontend_admin:
    build:
      context: ../..
      dockerfile: frontend_admin/Dockerfile
      args:
        NEXT_PUBLIC_BASE_URL: http://${PUBLIC_HOST:-127.0.0.1}:6080
    container_name: classai_frontend_admin
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4000:4000"

volumes:
  mysql_data:
  redis_data:
  minio_data:
